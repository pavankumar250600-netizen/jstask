<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Warehouse Management System</title>
</head>
<body>

    <h1>Smart Warehouse Management System</h1>
    <p>Open the browser console (F12 → Console) to view the report.</p>

    <script>

        // Input Data
        const products = [
            {
                name: "  wireless mouse ",
                category: "electronics",
                quantity: 25,
                price: 799
            },
            {
                name: "Gaming Keyboard",
                category: "ELECTRONICS",
                quantity: 8,
                price: 2499
            },
            {
                name: "office chair",
                category: "furniture",
                quantity: 3,
                price: 5999
            },
            {
                name: "LED Monitor",
                category: "Electronics",
                quantity: 15,
                price: 10999
            },
            {
                name: "water bottle",
                category: "home",
                quantity: 50,
                price: 299
            }
        ];


        const cleanedProducts = products.map(product => {

            const properCase = product.name
                .trim()
                .toLowerCase()
                .split(" ")
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(" ");

            const inventoryValue = product.quantity * product.price;

            let stockStatus = "";

            if (product.quantity > 20) {
                stockStatus = "HIGH STOCK";
            } else if (product.quantity >= 10) {
                stockStatus = "MEDIUM STOCK";
            } else if (product.quantity >= 1) {
                stockStatus = "LOW STOCK";
            } else {
                stockStatus = "OUT OF STOCK";
            }

            return {
                ...product,
                name: properCase,
                category: product.category.toUpperCase(),
                inventoryValue,
                stockStatus
            };
        });


        console.log("\n======================================");
        console.log("        PRODUCT DETAILS REPORT");
        console.log("======================================");

        cleanedProducts.forEach((product, index) => {
            console.log(`
${index + 1}. ${product.name}
Category        : ${product.category}
Quantity        : ${product.quantity}
Price           : ₹${product.price}
Inventory Value : ₹${product.inventoryValue}
Stock Status    : ${product.stockStatus}
--------------------------------------`);
        });


        const totalProducts = cleanedProducts.length;

        const totalInventoryValue = cleanedProducts.reduce(
            (sum, product) => sum + product.inventoryValue,
            0
        );

        const averagePrice =
            cleanedProducts.reduce((sum, product) => sum + product.price, 0) /
            totalProducts;

        const mostExpensive = cleanedProducts.reduce((a, b) =>
            a.price > b.price ? a : b
        );

        const cheapest = cleanedProducts.reduce((a, b) =>
            a.price < b.price ? a : b
        );

        const highestQuantity = cleanedProducts.reduce((a, b) =>
            a.quantity > b.quantity ? a : b
        );

        const lowestQuantity = cleanedProducts.reduce((a, b) =>
            a.quantity < b.quantity ? a : b
        );

        console.log("\n======================================");
        console.log("       WAREHOUSE STATISTICS");
        console.log("======================================");

        console.log("Total Products           :", totalProducts);
        console.log("Total Inventory Value    : ₹" + totalInventoryValue);
        console.log("Average Product Price    : ₹" + averagePrice.toFixed(2));
        console.log("Most Expensive Product   :", mostExpensive.name);
        console.log("Cheapest Product         :", cheapest.name);
        console.log("Highest Quantity Product :", highestQuantity.name);
        console.log("Lowest Quantity Product  :", lowestQuantity.name);


        const keyword = "ele";

        const searchResults = cleanedProducts.filter(product =>
            product.category.toLowerCase().includes(keyword.toLowerCase())
        );

        console.log("\n======================================");
        console.log("          SEARCH RESULTS");
        console.log("======================================");
        console.log(`Keyword: "${keyword}"\n`);

        searchResults.forEach(product => {
            console.log(`${product.name} (${product.category})`);
        });


        const priceSorted = [...cleanedProducts].sort(
            (a, b) => b.price - a.price
        );

        const quantitySorted = [...cleanedProducts].sort(
            (a, b) => a.quantity - b.quantity
        );

        console.log("\n======================================");
        console.log("      PRICE: HIGH TO LOW");
        console.log("======================================");

        priceSorted.forEach(product => {
            console.log(`${product.name} - ₹${product.price}`);
        });

        console.log("\n======================================");
        console.log("    QUANTITY: LOW TO HIGH");
        console.log("======================================");

        quantitySorted.forEach(product => {
            console.log(`${product.name} - ${product.quantity}`);
        });


        const top3Costliest = [...cleanedProducts]
            .sort((a, b) => b.price - a.price)
            .slice(0, 3);

        console.log("\n======================================");
        console.log("      TOP 3 COSTLIEST PRODUCTS");
        console.log("======================================");

        top3Costliest.forEach((product, index) => {
            console.log(`${index + 1}. ${product.name} - ₹${product.price}`);
        });


        console.log("\n======================================");
        console.log("         LOW STOCK ALERTS");
        console.log("======================================");

        cleanedProducts.forEach(product => {
            if (product.quantity < 5) {
                console.log(
                    `WARNING: ${product.name} stock is critically low.`
                );
            }
        });


        const categorySummary = {};

        cleanedProducts.forEach(product => {
            categorySummary[product.category] =
                (categorySummary[product.category] || 0) + 1;
        });

        console.log("\n======================================");
        console.log("         CATEGORY SUMMARY");
        console.log("======================================");

        for (let category in categorySummary) {
            console.log(`${category} : ${categorySummary[category]}`);
        }

        // ===============================
        // STOCK VISUALIZATION
        // ===============================

        console.log("\n======================================");
        console.log("        STOCK VISUALIZATION");
        console.log("======================================");

        cleanedProducts.forEach(product => {
            console.log(
                `${product.name.padEnd(18)} ${"#".repeat(product.quantity)}`
            );
        });

        console.log("\n======================================");
        console.log("         REPORT COMPLETED");
        console.log("======================================");
    </script>

</body>
</html>
